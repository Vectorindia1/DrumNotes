<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrumScribe player</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f4f6; --fg:#1b1b1f; --bar:#fff; --blue:#1e66ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181c; --fg:#e8e8ec; --bar:#202228; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
           padding:8px 16px; background:var(--bar); box-shadow:0 1px 4px #0003; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  button, select { font:inherit; padding:5px 12px; border:1px solid #8886; border-radius:6px; background:transparent; color:inherit; cursor:pointer; }
  #play { background:var(--blue); color:#fff; border-color:var(--blue); min-width:90px; }
  #bar { min-width:110px; font-variant-numeric:tabular-nums; }
  small { opacity:.65 }
  #pages { max-width:1000px; margin:12px auto 60px; padding:0 16px; }
  .page { position:relative; background:#fff; margin-bottom:14px; box-shadow:0 1px 6px #0004; cursor:pointer; }
  .page img { width:100%; height:100%; display:block; user-select:none; }
  .playhead { position:absolute; width:3px; margin-left:-1.5px; background:var(--blue); border-radius:2px;
              box-shadow:0 0 6px 1px #1e66ff99; pointer-events:none; }
  .barbox { position:absolute; background:#1e66ff1c; pointer-events:none; }
</style></head>
<body>
<header>
  <h1 id="title"></h1>
  <button id="prev" title="previous bar (←)">⏮</button>
  <button id="play">▶ Play</button>
  <button id="next" title="next bar (→)">⏭</button>
  <span id="bar"></span>
  <label>Audio <select id="source"></select></label>
  <label>Speed <select id="rate"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label>
  <label title="If the blue line is AHEAD of the sound, raise this. If it is BEHIND the sound, lower it. Keys: [ and ]">Sync <input id="sync" type="range" min="-300" max="300" step="5" value="0" style="vertical-align:middle;width:110px"> <span id="syncv" style="display:inline-block;min-width:56px;font-variant-numeric:tabular-nums"></span></label>
  <small>click a bar to jump · space = play/pause · ← → = bar · [ ] = sync</small>
</header>
<audio id="audio" preload="auto"></audio>
<div id="pages"></div>
<script src="data.js"></script>
<script src="viewer.js"></script>
</body></html>
